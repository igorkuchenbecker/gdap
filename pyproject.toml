[project]
name = "gdap"
version = "0.1.0"
description = "GDAP - Global Data Automation Platform: connect, profile, validate, transform, analyze, explain and automate data at scale."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDAP Team" }]
keywords = ["data", "etl", "pipeline", "analytics", "observability", "ai"]

dependencies = [
    # --- contracts & configuration -------------------------------------
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    # --- api ------------------------------------------------------------
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # --- cli ------------------------------------------------------------
    "typer>=0.12",
    "rich>=13.7",
    # --- metadata store --------------------------------------------------
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # --- data plane -------------------------------------------------------
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=16",
    # --- analytics / ml ---------------------------------------------------
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    # --- reporting --------------------------------------------------------
    "jinja2>=3.1",
    "plotly>=5.22",
    "xlsxwriter>=3.2",
    # --- scheduling / io ---------------------------------------------------
    "croniter>=2.0",
    "httpx>=0.27",
    # --- observability ------------------------------------------------------
    "structlog>=24.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
excel = ["openpyxl>=3.1", "fastexcel>=0.11"]
ai = ["anthropic>=0.40"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[project.scripts]
gdap = "gdap.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gdap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S", "ANN"]
# ANN401: typed **kwargs of Any are legitimate at plugin boundaries.
# S101:   asserts are used in tests and as internal invariants.
# B008:   FastAPI/Typer express dependencies and options as call defaults by design.
# E501:   `ruff format` owns code width (line-length below); E501 would then only fire on string
#         literals and comments it cannot split, which is noise rather than signal.
ignore = ["ANN401", "S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S", "E501"]
# Typer expresses a repeatable option as a list default; that is the documented idiom, and the
# list is never mutated.
"src/gdap/cli/commands/*" = ["B006"]
# The demo generator seeds data with the standard PRNG on purpose: reproducibility, not secrecy.
"src/gdap/demo/*" = ["S311"]

[tool.mypy]
# No python_version pin: mypy then targets the running interpreter. Pinning to 3.11 breaks on
# dependency stubs (numpy) that use 3.12+ type syntax, while runtime support stays >=3.11.
packages = ["gdap"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that touch a real database / filesystem / http server",
    "e2e: full end-to-end platform flows",
    "slow: long running tests",
]
filterwarnings = ["ignore::DeprecationWarning"]
